# systemd drop-in for the OS snmptrapd.service (snmptrapd mirror method)
# install as /etc/systemd/system/snmptrapd.service.d/omd-mirror.conf
#
# Replaces the distribution's command line (Debian/Ubuntu: -LOw,
# RHEL family: $OPTIONS=-Lsd, SUSE: none) with one that is identical on
# every distribution. Deliberately NO -L destination: a -L flag registers
# a per-trap print handler which doNotLogTraps does not gate, so every
# trap would end up in journald. The listen address is the default
# (udp:162); where the distribution ships snmptrapd.socket, the daemon
# takes over the socket's file descriptor.
[Service]
ExecStart=
ExecStart=/usr/sbin/snmptrapd -f -C -c /etc/snmp/snmptrapd.conf
