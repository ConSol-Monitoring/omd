auth_enabled: false

server:
  http_listen_port: ${CONFIG_LOKI_HTTP_PORT:-3100}
  grpc_listen_port: ${CONFIG_LOKI_GRPC_PORT:-9096}
  log_level: info
  log_format: logfmt
  grpc_server_max_concurrent_streams: 1000

limits_config:
  retention_period: ${CONFIG_LOKI_RETENTION:-32d}
  allow_structured_metadata: false

common:
  instance_addr: 127.0.0.1
  path_prefix: var/loki
  storage:
    filesystem:
      chunks_directory: var/loki/chunks
      rules_directory: var/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

compactor:
  working_directory: var/loki/retention
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 5m
  retention_delete_worker_count: 150
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-12-06
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: localhost:${CONFIG_LOKI_HTTP_PORT:-3100}

ruler:
  alertmanager_url: http://${CONFIG_ALERTMANAGER_TCP_ADDR:-127.0.0.1}:${CONFIG_ALERTMANAGER_TCP_PORT:-9093}

frontend:
  encoding: protobuf

analytics:
  reporting_enabled: false
